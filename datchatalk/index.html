<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>دجه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: right-to-left three-pane workspace. Departments (right) | task list grouped by priority (middle) | selected task workflow (left).
   Priority colors: red = urgent, amber = medium, green = not urgent. Brand teal is for actions. */
:root{
  --bg:#FFFFFF; --soft:#F3F5F7; color-scheme:light; --surface:#FFFFFF; --ink:#13202B; --muted:#586977; --line:#D6DEE5;
  --brand:#0B7A77; --brand-bg:#DDF0EF;
  --urgent:#C4342A; --urgent-bg:#FBE3E0;
  --mid:#A86A0A; --mid-bg:#FBEBCB;
  --low:#1D7F55; --low-bg:#D8F0E3;
  --font-display:'Noto Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --font-body:'Noto Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;color:var(--brand);margin:0}
.brand small{font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--muted);margin-inline-start:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 10px;text-wrap:balance}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}

.shell{display:grid;grid-template-columns:210px 330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.shell{grid-template-columns:210px minmax(0,1fr)}.detail{grid-column:1/-1}}
@media (max-width:720px){.shell{grid-template-columns:minmax(0,1fr)}}

/* departments */
.depts{display:flex;flex-direction:column;gap:4px;padding:10px}
.depts .label{padding:2px 8px}
.dept{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;background:transparent;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:8px 10px;font-weight:500}
.dept:hover{background:var(--soft)}
.dept.on{background:var(--brand-bg);border-color:var(--brand);color:var(--ink)}
.dept .nums{display:flex;gap:4px;flex-shrink:0}
.count{min-width:24px;text-align:center;border-radius:999px;font-size:12px;padding:0 7px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.count.u{background:var(--urgent);color:var(--surface);border-color:var(--urgent);font-weight:600}
@media (max-width:720px){
  .depts{flex-direction:row;overflow-x:auto;padding:8px}
  .depts .label{display:none}
  .dept{width:auto;white-space:nowrap}
}

/* list */
.dept-note{font-size:13px;color:var(--muted);margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.f{font-size:13px;padding:2px 10px;border-radius:999px;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.f.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.group{margin-bottom:12px}
.gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.u-bg{background:var(--urgent)}.m-bg{background:var(--mid)}.l-bg{background:var(--low)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.t{display:grid;grid-template-columns:6px minmax(0,1fr);width:100%;text-align:start;padding:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-weight:400}
.t .bar{display:block}
.t .body{padding:8px 12px;min-width:0}
.t.u{background:var(--urgent-bg)}.t.m{background:var(--mid-bg)}.t.l{background:var(--low-bg)}
.t.sel{outline:2px solid var(--brand);outline-offset:1px}
.t-title{display:block;font-weight:600;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}

/* detail */
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.d-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-start}
.d-title{font-size:19px;font-weight:600;margin:0;min-width:0;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.urgent{background:var(--urgent-bg);color:var(--urgent);border-color:var(--urgent)}
.pill.mid{background:var(--mid-bg);color:var(--mid);border-color:var(--mid)}
.pill.low{background:var(--low-bg);color:var(--low);border-color:var(--low)}
.pill.st{background:var(--soft);color:var(--ink);border-color:var(--line)}
.pill.st.blocked{background:var(--urgent-bg);color:var(--urgent);border-color:var(--urgent)}
.pill.st.done{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.route li{font-size:13px;padding:1px 10px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.route li.cur{background:var(--brand-bg);border-color:var(--brand);color:var(--ink);font-weight:600}
.route li.past{text-decoration:line-through}
.route .ar{border:0;padding:0;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0 0;padding:0}
.meta div{min-width:0}
.meta dt{font-size:12px;color:var(--muted)}
.meta dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.blocknote{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--urgent-bg);color:var(--urgent);font-size:14px}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:0}
.steps li{position:relative;text-align:center;padding-top:34px;font-size:13px;color:var(--muted)}
.steps li::before{content:"";position:absolute;top:12px;inset-inline:-50% 50%;height:2px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.current::before{background:var(--brand)}
.dot{position:absolute;top:0;left:0;right:0;margin:0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;z-index:1}
.steps li.done .dot{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.steps li.current{color:var(--ink);font-weight:600}
.steps li.current .dot{border-color:var(--brand);color:var(--brand)}
.steps li.blocked .dot{border-color:var(--urgent);color:var(--urgent);background:var(--urgent-bg)}
.steps li.blocked{color:var(--urgent)}

.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

.turn{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 10px;border-radius:6px;font-size:13px;font-weight:600;background:var(--brand-bg);color:var(--ink);border:1px solid var(--brand)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
label{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid transparent}
.b-main{background:var(--brand);color:var(--surface)}
.b-bad{background:var(--urgent);color:var(--surface)}
.b-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.b-sim{background:transparent;color:var(--mid);border:1px dashed var(--mid)}
button:hover{filter:brightness(1.08)}
.sim-title{margin:16px 0 6px;font-size:12px;color:var(--muted)}
.hint{margin:14px 0 0;font-size:14px;color:var(--muted);max-width:62ch}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto}
.item{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--soft)}
.item.notify{border-inline-start:4px solid var(--mid)}
.item.activity{border-inline-start:4px solid var(--brand)}
.item-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.item-text{margin:0;font-size:14px;overflow-wrap:anywhere}
.item-ch{margin:2px 0 0;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
@media (prefers-reduced-motion:no-preference){.item{animation:rise .25s ease-out}}
@keyframes rise{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* attendee-experience board */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft)}
.stat b{display:block;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--urgent)}
.al-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.al{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.al.unread{background:var(--soft)}
.al.k-sponsor{border-inline-start:4px solid var(--mid)}
.al.k-complaint{border-inline-start:4px solid var(--urgent)}
.al.k-assign{border-inline-start:4px solid var(--low)}
.al.k-change{border-inline-start:4px solid var(--brand)}
.al-body{min-width:0}
.al-kind{font-size:12px;color:var(--muted);margin:0}
.al-text{margin:0;font-size:14px;overflow-wrap:anywhere}
.al.unread .al-text{font-weight:600}
.al button{padding:2px 10px;font-size:13px;white-space:nowrap}
.sess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sc{display:block;text-align:start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:400}
.sc.sel{outline:2px solid var(--brand);outline-offset:1px}
.sc b{display:block;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sc small{display:block;color:var(--muted);font-size:12px}
.flag{display:block;color:var(--urgent);font-size:12px;font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--low)}
.meter.over i{background:var(--urgent)}
.warn-text{color:var(--urgent);font-weight:600;font-size:14px;margin:4px 0}
.ok-text{color:var(--low);font-weight:600;font-size:14px;margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;color:var(--ink)}
.chk input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pchip{padding:1px 10px;border-radius:999px;background:var(--brand-bg);border:1px solid var(--brand);font-size:13px}
.pchip.vol{background:var(--mid-bg);border-color:var(--mid)}
.steps.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.steps.s6 li{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.row .field{flex:1 1 140px}
.sub-h{font-size:13px;font-weight:600;margin:14px 0 4px}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <div class="top">
    <h1 class="brand">دجه<small>مهام الأقسام</small></h1>
    <button type="button" class="b-main" id="new-btn">+ مهمة جديدة</button>
  </div>

  <div class="shell">
    <nav class="card depts" id="depts" aria-label="الأقسام"></nav>

    <section class="card" aria-labelledby="l-h">
      <h2 id="l-h">المهام</h2>
      <p class="dept-note" id="dept-note"></p>
      <div class="filters" id="filters" role="group" aria-label="تصفية حسب الأولوية"></div>
      <div id="list"></div>
    </section>

    <main class="detail" id="detail"></main>
  </div>
  <p class="note">الأقسام والأسماء والمهام أمثلة للتجربة. التغييرات تبقى في هذه الصفحة فقط ولا تُحفظ بعد إغلاقها.</p>
</div>

<script>
(function(){
  var DEPTS = [
    {id:'pr',name:'العلاقات العامة',members:['فهد','لمى'],note:'حجز مكان الجلسة والتواصل مع الجهة.'},
    {id:'written',name:'المحتوى المكتوب',members:['نورة','ماجد'],note:''},
    {id:'visual',name:'المحتوى المرئي',members:['سعد','هند'],note:''},
    {id:'attendee',name:'تجربة الحضور',members:['ريم','تركي'],note:'المسؤول التشغيلي: فاطمة السريج · المسؤول المطور: اثير العيسي.'},
    {id:'digital',name:'الهوية الرقمية',members:['بدر','جود'],note:''},
    {id:'quality',name:'قياس الجودة',members:['عبدالله','منى'],note:''},
    {id:'social',name:'السوشل ميديا',members:['خالد','دانة'],note:''}
  ];
  var PRIO = {
    urgent:{label:'مستعجل',cls:'u',order:0},
    mid:{label:'متوسط',cls:'m',order:1},
    low:{label:'غير مستعجل',cls:'l',order:2}
  };
  var PHASES = ['الإسناد','الاستلام','التنفيذ','المراجعة','الإنهاء'];
  var PILL = {assigned:'بانتظار الاستلام',inprogress:'قيد العمل',blocked:'متوقفة',review:'بانتظار المراجعة',done:'مكتملة'};
  var CH = 'داخل التطبيق · الجوال · الإيميل';

  function dept(id){ return DEPTS.filter(function(d){return d.id===id;})[0]; }
  function isoPlus(days){
    var d = new Date(); d.setDate(d.getDate()+days);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(iso){
    try { return new Date(iso+'T00:00:00').toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'long'}); }
    catch(e){ return iso; }
  }
  function h(tag, props){
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function(k){
      if(k==='class') el.className = props[k];
      else if(k==='text') el.textContent = props[k];
      else if(k==='on') el.addEventListener('click', props[k]);
      else if(k==='change') el.addEventListener('change', props[k]);
      else el.setAttribute(k, props[k]);
    });
    for(var i=2;i<arguments.length;i++){ if(arguments[i]) el.appendChild(arguments[i]); }
    return el;
  }
  function val(id){ var e=document.getElementById(id); return e ? e.value.trim() : ''; }

  /* ---------- data ---------- */
  var nextId = 1;
  var tasks = [];
  var sel = null, deptFilter = 'all', prioFilter = 'all', creating = false;

  function curDept(t){ return t.route[t.idx]; }
  function pickMember(deptId, salt){ var m = dept(deptId).members; return m[salt % m.length]; }
  function mk(o){
    var t = {id:nextId++,title:o.title,prio:o.prio,due:isoPlus(o.days),route:o.route,idx:o.idx||0,phase:o.phase,
      hours:0,blockReason:o.blockReason||'',blockWho:o.blockWho||'',feed:[]};
    t.assignee = pickMember(curDept(t), t.id);
    (o.feed||[]).forEach(function(f){ t.feed.push({kind:f[0],to:f[1],text:f[2],ch:f[3]||'',t:f[4]||0}); });
    tasks.push(t);
    return t;
  }
  function seed(){
    mk({title:'حجز مكان الجلسة والتواصل مع الجهة المستضيفة',prio:'urgent',days:2,route:['pr'],phase:'assigned',
      feed:[['notify','العضو (فهد)','رئيس القسم أسند لك مهمة جديدة: «حجز مكان الجلسة والتواصل مع الجهة المستضيفة».',CH,0]]});
    mk({title:'كتابة نص إعلان الجلسة',prio:'mid',days:4,route:['written','visual','social','quality'],phase:'inprogress',
      feed:[['activity','رئيس القسم','نشر المهمة وأسندها',' ',0],['activity','العضو','ضغط «استلمت المهمة»','',1]]});
    mk({title:'تصميم بوستر الجلسة',prio:'urgent',days:3,route:['visual','social','quality'],phase:'blocked',
      blockReason:'أنتظر النص النهائي من كتابة المحتوى',blockWho:'@نورة',
      feed:[['activity','العضو','غيّر الحالة إلى متوقفة. السبب: أنتظر النص النهائي من كتابة المحتوى','',30]]});
    mk({title:'جدولة منشورات الأسبوع',prio:'low',days:6,route:['social','quality'],phase:'review',
      feed:[['notify','رئيس القسم','مهمة «جدولة منشورات الأسبوع» بانتظار مراجعتك.',CH,52]]});
    mk({title:'مراجعة مواد الجلسة قبل النشر',prio:'mid',days:5,route:['quality'],phase:'assigned'});
    mk({title:'مقال المدونة الشهري',prio:'low',days:9,route:['written','quality'],phase:'inprogress'});
    mk({title:'تحديث قالب العروض التقديمية',prio:'mid',days:-1,route:['visual'],phase:'done',
      feed:[['notify','كل المشاركين','انتهت المهمة «تحديث قالب العروض التقديمية».',CH,60]]});
    mk({title:'تجهيز مسار استقبال الحضور وتسجيل الدخول',prio:'mid',days:4,route:['attendee','quality'],phase:'inprogress'});
    mk({title:'تحديث ألوان الهوية على صفحة التسجيل',prio:'low',days:8,route:['digital','quality'],phase:'assigned'});
    sel = 1;
  }
  seed();

  function get(id){ return tasks.filter(function(t){return t.id===id;})[0]; }
  function log(t,kind,to,text,ch){ t.feed.unshift({kind:kind,to:to,text:text,ch:ch||'',t:t.hours}); }
  function who(t){ return 'العضو ('+t.assignee+')'; }

  /* ---------- transitions ---------- */
  var T = {
    receive:function(t){ t.phase='inprogress';
      log(t,'activity',who(t),'ضغط «استلمت المهمة»');
      log(t,'notify','رئيس القسم',t.assignee+' استلم المهمة وتغيّرت حالتها إلى قيد العمل.',CH); },
    noReceive:function(t){ t.hours+=24;
      log(t,'notify',who(t),'تذكير: المهمة «'+t.title+'» ما زالت بانتظار استلامك.',CH);
      log(t,'notify','رئيس القسم','مرّت 24 ساعة ولم يستلم '+t.assignee+' المهمة.',CH); },
    update:function(t){ var c=val('f-comment');
      log(t,'activity',who(t), c ? 'حدّث التقدم: '+c : 'حدّث تقدم المهمة'); },
    stale:function(t){ t.hours+=48;
      log(t,'notify',who(t),'ما فيه أي تحديث على «'+t.title+'» منذ يومين.',CH);
      log(t,'notify','رئيس القسم','ما فيه أي تحديث من '+t.assignee+' منذ يومين.',CH); },
    block:function(t){
      t.blockReason = val('f-reason') || 'بدون سبب مكتوب'; t.blockWho = val('f-who'); t.phase='blocked';
      log(t,'activity',who(t),'غيّر الحالة إلى متوقفة. السبب: '+t.blockReason);
      log(t,'notify','المسؤول عن العائق'+(t.blockWho?' ('+t.blockWho+')':''),t.assignee+' ينتظر منك حلًّا لعائق: '+t.blockReason,CH);

      if(!a.read) li.appendChild(btn('b-ghost','تمت القراءة',bump(function(){ a.read=true; })));
      ul.appendChild(li);
    });
    ac.appendChild(ul);
    ac.appendChild(h('p',{class:'sim-title',text:'محاكاة وصول تنبيه'}));
    var sims = h('div',{class:'btns'});
    var tgt = function(){ return gs(sessSel) || sessions[0]; };
    sims.appendChild(btn('b-sim','سبونسر جديد',bump(function(){ addAlert(tgt().id,'sponsor','سبونسر جديد يحتاج تنسيق مع العلاقات العامة في التوزيع.'); })));
    sims.appendChild(btn('b-sim','وصلت شكوى',bump(function(){ addAlert(tgt().id,'complaint','وصلت ملاحظة من أحد الحضور. المتابعة النهائية عند القسم الداخلي.'); })));
    sims.appendChild(btn('b-sim','تغيير وقت الجلسة',bump(function(){ addAlert(tgt().id,'change','تغيّر وقت الجلسة وأُرسل التغيير في القروب العام.'); })));
    ac.appendChild(sims);
    root.appendChild(ac);

    /* sessions */
    var sc = h('section',{class:'card'},h('h2',{text:'الجلسات والفرص'}));
    var grid = h('div',{class:'sess-grid'});
    sessions.slice().sort(function(a,b){ return (a.phase>=5)-(b.phase>=5) || a.date.localeCompare(b.date); }).forEach(function(x){
      var b = h('button',{type:'button',class:'sc'+(x.id===sessSel?' sel':''),on:bump(function(){ sessSel=x.id; })},
        h('b',{text:x.title}),
        h('small',{text:fmtDate(x.date)+' · '+relDays(x)+' · '+x.venue}),
        h('small',{text:PH[x.phase]+' · المشاركون '+crew(x)+' من '+x.needed}));
      reasons(x).forEach(function(r){ b.appendChild(h('span',{class:'flag',text:r})); });
      grid.appendChild(b);
    });
    sc.appendChild(grid);
    root.appendChild(sc);

    var x = gs(sessSel);
    if(x) root.appendChild(renderSession(x));
    root.appendChild(h('p',{class:'note',text:'الجلسات والأسماء والأعداد أمثلة للتجربة. الشكاوى والتقييمات تصل للقسم الداخلي وهنا تظهر لك للعلم فقط.'}));
  }

  function numField(id,labelText,x,key){
    var inp = h('input',{id:id,type:'number',min:'0',value:String(x[key])});
    inp.addEventListener('change',function(){ var v=parseInt(inp.value,10); x[key]=isNaN(v)||v<0?0:v; render(); });
    return field(id,labelText,inp);
  }
  function checklist(x,list,arr){
    var box = h('div',{});
    list.forEach(function(name,i){
      var cb = h('input',{type:'checkbox',id:'c-'+x.id+'-'+arr+'-'+i});
      cb.checked = !!x[arr][i];
      cb.addEventListener('change',function(){ x[arr][i]=cb.checked; render(); });
      box.appendChild(h('label',{class:'chk',for:'c-'+x.id+'-'+arr+'-'+i},cb,h('span',{text:name})));
    });
    return box;
  }
  function renderSession(x){
    var card = h('section',{class:'card'});
    card.appendChild(h('div',{class:'d-top'},h('h2',{class:'d-title',text:x.title}),h('span',{class:'pill st',text:PH[x.phase]})));
    card.appendChild(h('p',{class:'dept-note',text:fmtDate(x.date)+' ('+relDays(x)+') · '+x.venue}));

    var steps = h('ol',{class:'steps s6','aria-label':'مراحل الجلسة'});
    PH.forEach(function(name,i){
      var c = i<x.phase || x.phase===5 ? 'done' : (i===x.phase?'current':'');
      var li = h('li',{class:c},h('span',{class:'dot',text:c==='done'?'✓':String(i+1)}),h('span',{text:name}));
      if(i===x.phase && x.phase<5) li.setAttribute('aria-current','step');
      steps.appendChild(li);
    });
    card.appendChild(steps);

    var rs = reasons(x);
    if(rs.length){
      card.appendChild(h('p',{class:'sub-h',text:'تحتاج متابعة'}));
      rs.forEach(function(r){ card.appendChild(h('p',{class:'warn-text',text:'• '+r})); });
    } else if(x.phase<5){
      card.appendChild(h('p',{class:'ok-text',text:'ما فيه شي يحتاج متابعة حاليًا.'}));
    }

    /* capacity */
    card.appendChild(h('p',{class:'sub-h',text:'المسجلون والكراسي'}));
    card.appendChild(h('div',{class:'row'},numField('n-reg-'+x.id,'عدد المسجلين',x,'registered'),numField('n-ch-'+x.id,'عدد الكراسي',x,'chairs')));
    var pct = x.chairs ? Math.min(100, Math.round(x.registered/x.chairs*100)) : 100;
    var over = x.registered > x.chairs;
    var m = h('div',{class:'meter'+(over?' over':''),role:'img','aria-label':'نسبة المسجلين إلى الكراسي'},h('i',{style:'width:'+pct+'%'}));
    card.appendChild(m);
    card.appendChild(h('p',{class:over?'warn-text':'ok-text',text: over ? 'ينقص '+(x.registered-x.chairs)+' كرسي لتغطية كل المسجلين.' : 'الكراسي تكفي المسجلين.'}));

    /* crew */
    card.appendChild(h('p',{class:'sub-h',text:'المشاركون ('+crew(x)+' من '+x.needed+')'}));
    var chips = h('div',{class:'chips'});
    if(!crew(x)) chips.appendChild(h('span',{class:'empty',text:'ما تم توزيع أحد بعد.'}));
    x.team.forEach(function(n){ chips.appendChild(h('span',{class:'pchip',text:n})); });
    x.vol.forEach(function(n){ chips.appendChild(h('span',{class:'pchip vol',text:n})); });
    card.appendChild(chips);
    if(x.phase<4){
      var free = POOL.filter(function(n){ return x.team.indexOf(n)<0; });
      var pick = opts(h('select',{id:'p-'+x.id}), free.map(function(n){return [n,n];}), '');
      var vd = opts(h('select',{id:'v-'+x.id}), DEPTS.filter(function(d){return d.id!=='attendee';}).map(function(d){return [d.id,d.name];}), '');
      card.appendChild(h('div',{class:'row'},field('p-'+x.id,'أضف من الفريق',pick),
        btn('b-ghost','أضف',bump(function(){ var v=pick.value; if(v && x.team.indexOf(v)<0){ x.team.push(v); addAlert(x.id,'assign','أُضيف '+v+' على الجلسة «'+x.title+'».'); } }))));
      card.appendChild(h('div',{class:'row'},field('v-'+x.id,'استعن بمتطوع من قسم آخر',vd),
        btn('b-ghost','أضف متطوعًا',bump(function(){
          var d = dept(vd.value); var nm = 'متطوع من '+d.name; x.vol.push(nm);
          addAlert(x.id,'assign','أُضيف '+nm+' على الجلسة «'+x.title+'».'); }))));
    }

    /* phase action */
    card.appendChild(h('p',{class:'sub-h',text:'الخطوة الحالية'}));
    var btns = h('div',{class:'btns'});
    if(x.phase===0){
      card.appendChild(h('p',{class:'hint',text:'راجع مين صوّت أو أبدى رغبته في المشاركة ثم وزّع الأدوار حسب احتياج الفرصة.'}));
      btns.appendChild(btn('b-main','ابدأ توزيع الأدوار',bump(function(){ x.phase=1; })));
    } else if(x.phase===1){
      card.appendChild(h('p',{class:'hint',text:'وزّع الأدوار وانشر جدول المسؤوليات في قروب تجربة الحضور. إذا العدد ناقص استعن بمتطوعين.'}));
      btns.appendChild(btn('b-main','تم التوزيع، ابدأ التجهيز',bump(function(){ x.phase=2; })));
    } else if(x.phase===2){
      card.appendChild(h('p',{class:'hint',text:'تأكد من المكان قبل الجلسة بوقت كافي.'}));
      card.appendChild(checklist(x,SETUP,'setup'));
      var left = x.setup.filter(function(v){return !v;}).length;
      if(left) card.appendChild(h('p',{class:'warn-text',text:'باقي '+left+' بند في التجهيز.'}));
      btns.appendChild(btn('b-main','المكان جاهز، ابدأ الجلسة',bump(function(){ x.phase=3; })));
    } else if(x.phase===3){
      card.appendChild(h('p',{class:'hint',text:'الحاضر يمسح الباركود عند الدخول ويُختم الكرت.'}));
      card.appendChild(h('p',{class:'ok-text',text:'دخل '+x.checkedIn+' من '+x.registered+' مسجل.'}));
      if(x.checkedIn>x.chairs) card.appendChild(h('p',{class:'warn-text',text:'الحضور تجاوز الكراسي بـ '+(x.checkedIn-x.chairs)+'.'}));
      btns.appendChild(btn('b-ghost','مسح باركود وختم الكرت (+1)',bump(function(){ x.checkedIn++; })));
      btns.appendChild(btn('b-ghost','+5',bump(function(){ x.checkedIn+=5; })));
      btns.appendChild(btn('b-main','انتهت الجلسة',bump(function(){ x.phase=4; })));
    } else if(x.phase===4){
      card.appendChild(h('p',{class:'hint',text:'بعد الجلسة: الصورة الجماعية وترتيب الأغراض، وبعدها ينتهي دورك التشغيلي.'}));
      card.appendChild(checklist(x,WRAP,'wrap'));
      btns.appendChild(btn('b-main','أنهِ دوري التشغيلي',bump(function(){ x.phase=5; })));
    } else {
      card.appendChild(h('p',{class:'hint',text:'الجلسة منتهية. حضر '+x.checkedIn+' من '+x.registered+' مسجل.'}));
    }
    card.appendChild(btns);
    return card;
  }

  document.getElementById('new-btn').addEventListener('click',function(){ creating=true; render(); document.getElementById('detail').scrollIntoView({block:'start'}); });
  function render(){ renderDepts(); renderList(); renderDetail(); }
  render();
})();
</script>

</html>
