<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دجه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}

/* Layout: right-to-left three-pane workspace. Departments (right) | task list grouped by priority (middle) | selected task workflow (left).
   Priority colors: red = urgent, amber = medium, green = not urgent. Brand teal is for actions. */
:root{
  --bg:#FFFFFF; --soft:#F3F5F7; color-scheme:light; --surface:#FFFFFF; --ink:#13202B; --muted:#586977; --line:#D6DEE5;
  --brand:#0B7A77; --brand-bg:#DDF0EF;
  --urgent:#C4342A; --urgent-bg:#FBE3E0;
  --mid:#A86A0A; --mid-bg:#FBEBCB;
  --low:#1D7F55; --low-bg:#D8F0E3;
  --font-display:'Noto Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --font-body:'Noto Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;color:var(--brand);margin:0}
.brand small{font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--muted);margin-inline-start:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 10px;text-wrap:balance}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}

.shell{display:grid;grid-template-columns:210px 330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.shell{grid-template-columns:210px minmax(0,1fr)}.detail{grid-column:1/-1}}
@media (max-width:720px){.shell{grid-template-columns:minmax(0,1fr)}}

/* departments */
.depts{display:flex;flex-direction:column;gap:4px;padding:10px}
.depts .label{padding:2px 8px}
.dept{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;background:transparent;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:8px 10px;font-weight:500}
.dept:hover{background:var(--soft)}
.dept.on{background:var(--brand-bg);border-color:var(--brand);color:var(--ink)}
.dept .nums{display:flex;gap:4px;flex-shrink:0}
.count{min-width:24px;text-align:center;border-radius:999px;font-size:12px;padding:0 7px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.count.u{background:var(--urgent);color:var(--surface);border-color:var(--urgent);font-weight:600}
@media (max-width:720px){
  .depts{flex-direction:row;overflow-x:auto;padding:8px}
  .depts .label{display:none}
  .dept{width:auto;white-space:nowrap}
}

/* list */
.dept-note{font-size:13px;color:var(--muted);margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.f{font-size:13px;padding:2px 10px;border-radius:999px;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.f.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.group{margin-bottom:12px}
.gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.u-bg{background:var(--urgent)}.m-bg{background:var(--mid)}.l-bg{background:var(--low)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.t{display:grid;grid-template-columns:6px minmax(0,1fr);width:100%;text-align:start;padding:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-weight:400}
.t .bar{display:block}
.t .body{padding:8px 12px;min-width:0}
.t.u{background:var(--urgent-bg)}.t.m{background:var(--mid-bg)}.t.l{background:var(--low-bg)}
.t.sel{outline:2px solid var(--brand);outline-offset:1px}
.t-title{display:block;font-weight:600;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}

/* detail */
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.d-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-start}
.d-title{font-size:19px;font-weight:600;margin:0;min-width:0;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.urgent{background:var(--urgent-bg);color:var(--urgent);border-color:var(--urgent)}
.pill.mid{background:var(--mid-bg);color:var(--mid);border-color:var(--mid)}
.pill.low{background:var(--low-bg);color:var(--low);border-color:var(--low)}
.pill.st{background:var(--soft);color:var(--ink);border-color:var(--line)}
.pill.st.blocked{background:var(--urgent-bg);color:var(--urgent);border-color:var(--urgent)}
.pill.st.done{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.route li{font-size:13px;padding:1px 10px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.route li.cur{background:var(--brand-bg);border-color:var(--brand);color:var(--ink);font-weight:600}
.route li.past{text-decoration:line-through}
.route .ar{border:0;padding:0;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0 0;padding:0}
.meta div{min-width:0}
.meta dt{font-size:12px;color:var(--muted)}
.meta dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.blocknote{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--urgent-bg);color:var(--urgent);font-size:14px}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:0}
.steps li{position:relative;text-align:center;padding-top:34px;font-size:13px;color:var(--muted)}
.steps li::before{content:"";position:absolute;top:12px;inset-inline:-50% 50%;height:2px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.current::before{background:var(--brand)}
.dot{position:absolute;top:0;left:0;right:0;margin:0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;z-index:1}
.steps li.done .dot{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.steps li.current{color:var(--ink);font-weight:600}
.steps li.current .dot{border-color:var(--brand);color:var(--brand)}
.steps li.blocked .dot{border-color:var(--urgent);color:var(--urgent);background:var(--urgent-bg)}
.steps li.blocked{color:var(--urgent)}

.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

.turn{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 10px;border-radius:6px;font-size:13px;font-weight:600;background:var(--brand-bg);color:var(--ink);border:1px solid var(--brand)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
label{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid transparent}
.b-main{background:var(--brand);color:var(--surface)}
.b-bad{background:var(--urgent);color:var(--surface)}
.b-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.b-sim{background:transparent;color:var(--mid);border:1px dashed var(--mid)}
button:hover{filter:brightness(1.08)}
.sim-title{margin:16px 0 6px;font-size:12px;color:var(--muted)}
.hint{margin:14px 0 0;font-size:14px;color:var(--muted);max-width:62ch}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto}
.item{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--soft)}
.item.notify{border-inline-start:4px solid var(--mid)}
.item.activity{border-inline-start:4px solid var(--brand)}
.item-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.item-text{margin:0;font-size:14px;overflow-wrap:anywhere}
.item-ch{margin:2px 0 0;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
@media (prefers-reduced-motion:no-preference){.item{animation:rise .25s ease-out}}
@keyframes rise{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* attendee-experience board */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft)}
.stat b{display:block;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--urgent)}
.al-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.al{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.al.unread{background:var(--soft)}
.al.k-sponsor{border-inline-start:4px solid var(--mid)}
.al.k-complaint{border-inline-start:4px solid var(--urgent)}
.al.k-assign{border-inline-start:4px solid var(--low)}
.al.k-change{border-inline-start:4px solid var(--brand)}
.al-body{min-width:0}
.al-kind{font-size:12px;color:var(--muted);margin:0}
.al-text{margin:0;font-size:14px;overflow-wrap:anywhere}
.al.unread .al-text{font-weight:600}
.al button{padding:2px 10px;font-size:13px;white-space:nowrap}
.sess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sc{display:block;text-align:start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:400}
.sc.sel{outline:2px solid var(--brand);outline-offset:1px}
.sc b{display:block;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sc small{display:block;color:var(--muted);font-size:12px}
.flag{display:block;color:var(--urgent);font-size:12px;font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--low)}
.meter.over i{background:var(--urgent)}
.warn-text{color:var(--urgent);font-weight:600;font-size:14px;margin:4px 0}
.ok-text{color:var(--low);font-weight:600;font-size:14px;margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;color:var(--ink)}
.chk input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pchip{padding:1px 10px;border-radius:999px;background:var(--brand-bg);border:1px solid var(--brand);font-size:13px}
.pchip.vol{background:var(--mid-bg);border-color:var(--mid)}
.steps.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.steps.s6 li{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.row .field{flex:1 1 140px}
.sub-h{font-size:13px;font-weight:600;margin:14px 0 4px}

.login{max-width:400px;margin:10vh auto 0}
.login .brand{font-size:56px;margin-bottom:6px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.err{color:var(--urgent);font-weight:600;font-size:14px;margin:0}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who span{font-size:14px;color:var(--muted)}
a.btn-link{display:inline-block;text-decoration:none;font-weight:600;border-radius:8px;padding:8px 16px;border:1px solid var(--low);color:var(--low);font:inherit;font-weight:600;line-height:1.7}
a.btn-link.off{border-color:var(--line);color:var(--muted);pointer-events:none}
.toast{position:fixed;z-index:50;bottom:max(16px,env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin:0 auto;max-width:460px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px}
.toast.bad{background:var(--urgent);color:#fff}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl select{padding:4px 8px}
.tbl .off{color:var(--muted)}
.cred{background:var(--brand-bg);border:1px solid var(--brand);border-radius:8px;padding:12px;margin:12px 0}
.cred p{margin:0 0 6px;overflow-wrap:anywhere}
.cred code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface);padding:1px 8px;border-radius:6px;direction:ltr;unicode-bidi:embed}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top-actions button{padding:6px 14px;font-size:14px}
.pending{color:var(--urgent);font-weight:600}

</style>
</head>

var root = document.getElementById('root');
var me = null, depts = [], people = [], tasks = [], sessions = [], alerts = [];

/* ---------- helpers ---------- */
function h(tag, props){
  var el = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if(k==='class') el.className = v;
    else if(k==='text') el.textContent = v;
    else if(k==='on') el.addEventListener('click', v);
    else if(k==='change') el.addEventListener('change', v);
    else el.setAttribute(k, v);
  });
  for(var i=2;i<arguments.length;i++){ if(arguments[i]) el.appendChild(arguments[i]); }
  return el;
}
function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function isoPlus(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ try{ return new Date(iso+'T00:00:00').toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'long'}); }catch(e){ return iso; } }
function fmtStamp(iso){ try{ return new Date(iso).toLocaleString('ar-SA-u-nu-latn',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function val(id){ var e=document.getElementById(id); return e ? String(e.value||'').trim() : ''; }
function field(id,labelText,control,wide){ return h('div',{class:'field'+(wide?' wide':'')},h('label',{for:id,text:labelText}),control); }
function btn(cls,text,fn){ return h('button',{type:'button',class:cls,on:fn,text:text}); }
function opts(select,list,cur){ list.forEach(function(o){ var op=h('option',{value:o[0],text:o[1]}); if(o[0]===cur) op.selected=true; select.appendChild(op); }); return select; }
function waPhone(p){ var d=String(p||'').replace(/\D/g,''); if(d.indexOf('00')===0) d=d.slice(2); if(d.length===10 && d.charAt(0)==='0') d='966'+d.slice(1); else if(d.length===9 && d.charAt(0)==='5') d='966'+d; return d; }
function waLink(p,text){ var n=waPhone(p); return n ? 'https://wa.me/'+n+'?text='+encodeURIComponent(text) : ''; }
function deptName(id){ var d=depts.filter(function(x){return x.id===id;})[0]; return d ? d.name : (id||'');}
function dept(id){ return depts.filter(function(x){return x.id===id;})[0]; }
function person(id){ return people.filter(function(x){return x.id===id;})[0]; }
function headOf(deptId){ return people.filter(function(p){return p.role==='head' && p.dept_id===deptId && p.active;})[0]; }
function toast(msg,kind){
  var old=document.getElementById('toast'); if(old) old.remove();
  var t=h('div',{id:'toast',class:'toast'+(kind==='bad'?' bad':''),role:'status','aria-live':'polite',text:msg});
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, kind==='bad'?7000:3500);
}
function errText(e){ return (e && e.message) ? e.message : String(e||''); }

async function fn(name, body){
  var r = await sb.functions.invoke(name, {body:body});
  if(r.error){
    var m = r.error.message;
    try{ if(r.error.context && r.error.context.json){ var j = await r.error.context.json(); if(j && j.error) m = j.error; } }catch(e){}
    throw new Error(m);
  }
  if(r.data && r.data.error) throw new Error(r.data.error);
  return r.data;
}

/* ---------- login / password ---------- */
function brandBlock(){ return h('h1',{class:'brand',text:'دجه'}); }
function renderLogin(msg){
  me = null;
  var email = h('input',{id:'l-email',type:'email',autocomplete:'username',inputmode:'email',dir:'ltr',required:'required'});
  var pass = h('input',{id:'l-pass',type:'password',autocomplete:'current-password',dir:'ltr',required:'required'});
  var err = h('p',{class:'err',id:'l-err',role:'alert',text:msg||''});
  var form = h('form',{},

async function afterLogin(){

}
function taskData(t){ return {title:t.title,desc:t.desc,prio:t.prio,due:t.due,route:t.route,idx:t.idx,phase:t.phase,blockReason:t.blockReason,blockWho:t.blockWho,feed:t.feed.slice(0,80),assignee:t.assignee,createdByName:t.createdByName,link:t.link,reviewerId:t.reviewerId,reviewer:t.reviewer}; }

async function loadAll(){
  var q = await Promise.all([
    sb.from('departments').select('*').order('sort'),
    sb.from('profiles').select('*').eq('active',true).order('full_name'),
    sb.from('tasks').select('*').order('created_at',{ascending:false}),
    sb.from('event_sessions').select('*'),
    sb.from('alerts').select('*').order('created_at',{ascending:false})
  ]);
  var bad = q.filter(function(x){return x.error;})[0];
  if(bad) toast('تعذر تحميل بعض البيانات: '+bad.error.message,'bad');
  depts = q[0].data || []; people = q[1].data || [];
  tasks = (q[2].data||[]).map(rowToTask);
  sessions = (q[3].data||[]).map(rowToSession);
  alerts = (q[4].data||[]).map(rowToAlert);
  if(!sessions.some(function(x){return x.id===sessSel;})) sessSel = sessions.length ? sessions[0].id : null;
  if(!tasks.some(function(t){return t.id===sel;})) sel = null;
}
async function saveTask(t){
  var row = {dept_id:curDept(t),assignee_id:t.assigneeId||null,data:taskData(t)};
  var r;
  if(t._p){ r = await sb.from('tasks').update(row).eq('id',t.id); }
  else { row.id=t.id; row.created_by=me.id; r = await sb.from('tasks').insert(row); if(!r.error){ t._p=true; t.createdBy=me.id; } }
  if(r.error){ toast('تعذر حفظ التغيير: '+r.error.message,'bad'); await loadAll(); render(); }
}
async function saveSession(x){
  var r;
  if(x._p){ r = await sb.from('event_sessions').update({data:sessionData(x)}).eq('id',x.id); }
  else { r = await sb.from('event_sessions').insert({id:x.id,dept_id:'attendee',data:sessionData(x),created_by:me.id}); if(!r.error) x._p=true; }
  if(r.error){ toast('تعذر حفظ الجلسة: '+r.error.message,'bad'); await loadAll(); render(); }
}
async function addAlert(sid,kind,text){
  var a = {id:uid(),sid:sid,kind:kind,text:text,read:false,at:new Date().toISOString()};
  alerts.unshift(a);
  var r = await sb.from('alerts').insert({id:a.id,dept_id:'attendee',data:{sid:sid,kind:kind,text:text,read:false}});

async function markRead(a){

/* ---------- roles ---------- */
function isAdmin(){ return me.role==='admin'; }
function canCreate(){ return me.role==='admin' || me.role==='head'; }
function curDept(t){ return t.route[t.idx]; }
function isAssignee(t){ return t.assigneeId===me.id; }
function canWork(t){ return isAssignee(t) || isAdmin(); }
function isOwner(t){ return t.createdBy===me.id || t.reviewerId===me.id || isAdmin() || (me.role==='head' && me.dept_id===curDept(t)); }
function seesAttendee(){ return isAdmin() || me.dept_id==='attendee'; }

/* ---------- task transitions ---------- */
function log(t,text){ t.feed.unshift({by:me.full_name,text:text,at:new Date().toISOString()}); }
var T = {
  receive:function(t){ t.phase='inprogress'; log(t,'استلم المهمة وبدأ العمل'); },
  update:function(t){ var c=val('f-comment'); log(t, c ? 'حدّث التقدم: '+c : 'حدّث تقدم المهمة'); },
  block:function(t){ t.blockReason=val('f-reason')||'بدون سبب مكتوب'; t.blockWho=val('f-who'); t.phase='blocked'; log(t,'غيّر الحالة إلى متوقفة. السبب: '+t.blockReason+(t.blockWho?' · بانتظار '+t.blockWho:'')); },
  resolve:function(t){ t.phase='inprogress'; t.blockReason=''; t.blockWho=''; log(t,'حلّ العائق وأرجع المهمة قيد العمل'); },
  deliver:function(t){ var l=val('f-link'); var ok=/^https?:\/\//i.test(l); if(ok) t.link=l; t.phase='review'; log(t,'سلّم الشغل وهو بانتظار المراجعة'+(ok?' مع رابط المواد':'')); },
  approve:function(t){
    log(t,'اعتمد الشغل');
    if(t.idx+1 < t.route.length){
      t.idx++; t.phase='assigned';
      var nh = headOf(curDept(t));
      t.assigneeId = nh ? nh.id : null; t.assignee = nh ? nh.full_name : '';
      log(t,'انتقلت المهمة إلى قسم '+deptName(curDept(t))+(nh?' (المسؤول: '+nh.full_name+')':' ولا يوجد له مسؤول بعد'));
    } else { t.phase='done'; log(t,'أُنهيت المهمة'); }
  },
  edit:function(t){ var n=val('f-notes')||'بدون ملاحظات مكتوبة'; t.phase='inprogress'; log(t,'طلب تعديلًا: '+n); }
};
function go(name){ return function(){
  var t = tasks.filter(function(x){return x.id===sel;})[0]; if(!t) return;
  T[name](t); render();
  saveTask(t).then(function(){ if(name==='approve'){ loadAll().then(render); } });
}; }

function gs(id){ return sessions.filter(function(x){return x.id===id;})[0]; }
function daysLeft(x){ var a=new Date(x.date+'T00:00:00'), b=new Date(); b.setHours(0,0,0,0); return Math.round((a-b)/864e5); }
function crew(x){ return x.team.length + x.vol.length; }
function vtxt(x){ return (x.time?x.time+' · ':'')+(x.venue||'المكان لم يُحدد'); }
function relDays(x){ var d=daysLeft(x); return d===0?'اليوم':d===1?'بكرة':d>1?'بعد '+d+' أيام':'قبل '+(-d)+' أيام'; }
function reasons(x){
  var r=[]; if(x.phase>=5) return r;
  if(x.phase<4 && (!x.needed||!x.chairs)) r.push('أكمل عدد المشاركين والكراسي');
  if(x.phase<4 && crew(x)<x.needed) r.push('ينقص '+(x.needed-crew(x))+' مشارك');
  if(x.chairs>0 && x.registered>x.chairs) r.push('المسجلون ('+x.registered+') أكثر من الكراسي ('+x.chairs+')');
  if(x.phase<3 && daysLeft(x)<=3 && x.setup.some(function(v){return !v;})) r.push('التجهيز غير مكتمل');
  var n = alerts.filter(function(a){return a.sid===x.id && !a.read;}).length; if(n) r.push(n+' تنبيه جديد');
  return r;
}
function bump(fn2,x){ return function(){ fn2(); render(); if(x) saveSession(x); }; }
function numField(id,labelText,x,key){
  var inp = h('input',{id:id,type:'number',min:'0',value:String(x[key])});
  inp.addEventListener('change',function(){ var v=parseInt(inp.value,10); x[key]=isNaN(v)||v<0?0:v; render(); saveSession(x); });
  return field(id,labelText,inp);
}
function checklist(x,list,arr){
  var b = h('div',{});
  list.forEach(function(name,i){
    var cb = h('input',{type:'checkbox',id:'c-'+x.id+'-'+arr+'-'+i}); cb.checked = !!x[arr][i];
    cb.addEventListener('change',function(){ x[arr][i]=cb.checked; render(); saveSession(x); });
    b.appendChild(h('label',{class:'chk',for:'c-'+x.id+'-'+arr+'-'+i},cb,h('span',{text:name})));
  });
  return b;
}

function renderSession(x){

  var list = h('section',{class:'card'},h('h2',{text:'الفريق ('+teamRows.length+')'}));
  var tb = h('table',{class:'tbl'});
  tb.appendChild(h('thead',{},h('tr',{},h('th',{text:'الاسم'}),h('th',{text:'الإيميل'}),h('th',{text:'الجوال'}),h('th',{text:'القسم'}),h('th',{text:'الدور'}),h('th',{text:''}))));
  var body = h('tbody');
  teamRows.forEach(function(p){
    var d = opts(h('select',{'aria-label':'القسم'}),[['','—']].concat(depts.map(function(x){return [x.id,x.name];})),p.dept_id||'');
    d.addEventListener('change',async function(){ try{ await fn('manage-members',{action:'update',user_id:p.id,dept_id:d.value}); toast('تم تحديث القسم'); await loadTeam(); await loadAll(); render(); }catch(e){ toast(errText(e),'bad'); } });
    var r = opts(h('select',{'aria-label':'الدور'}),[['member','عضو'],['head','مسؤول قسم'],['admin','مسؤول النظام']],p.role);
    r.addEventListener('change',async function(){ try{ await fn('manage-members',{action:'update',user_id:p.id,role:r.value}); toast('تم تحديث الدور'); await loadTeam(); await loadAll(); render(); }catch(e){ toast(errText(e),'bad'); render(); } });
    var acts = h('div',{class:'btns'});
    acts.appendChild(btn('b-ghost','كلمة سر جديدة',async function(){
      try{ var x = await fn('manage-members',{action:'reset',user_id:p.id}); cred={name:p.full_name,email:p.email,phone:p.phone,password:x.password}; render(); window.scrollTo(0,0); }catch(e){ toast(errText(e),'bad'); } }));
    if(p.id!==me.id) acts.appendChild(btn('b-ghost',p.active?'إيقاف':'تفعيل',async function(){
      try{ await fn('manage-members',{action:p.active?'deactivate':'activate',user_id:p.id}); await loadTeam(); await loadAll(); render(); }catch(e){ toast(errText(e),'bad'); } }));
    body.appendChild(h('tr',{class:p.active?'':'off'},h('td',{text:p.full_name+(p.active?'':' (موقوف)')}),h('td',{dir:'ltr',text:p.email}),h('td',{dir:'ltr',text:p.phone||'—'}),h('td',{},d),h('td',{},r),h('td',{},acts)));
  });
  tb.appendChild(body);
  list.appendChild(h('div',{class:'tbl-wrap'},tb));
  box.appendChild(list);
}

/* ---------- shell ---------- */
function topBar(){
  var left = h('h1',{class:'brand',text:'دجه'},h('small',{text:ROLE[me.role]+(me.dept_id?' · '+deptName(me.dept_id):'')}));
  var acts = h('div',{class:'top-actions'});
  acts.appendChild(h('span',{class:'who'},h('span',{text:me.full_name})));
  if(canCreate() && page==='work') acts.appendChild(btn('b-main','+ مهمة جديدة',function(){ creating=true; render(); }));
  if(isAdmin()) acts.appendChild(btn('b-ghost',page==='team'?'رجوع للمهام':'الفريق',async function(){ page = page==='team'?'work':'team'; if(page==='team') await loadTeam(); render(); }));
  acts.appendChild(btn('b-ghost','تحديث',async function(){ await loadAll(); if(page==='team') await loadTeam(); render(); toast('تم التحديث'); }));
  acts.appendChild(btn('b-ghost','كلمة السر',function(){ renderChangePassword(false); }));
  acts.appendChild(btn('b-ghost','خروج',logout));
  return h('div',{class:'top'},left,acts);
}
function render(){
  if(!me) return;
  var wrap = h('div',{class:'wrap',dir:'rtl',lang:'ar'});
  wrap.appendChild(topBar());
  if(page==='team'){
    var tb = h('div',{class:'detail'}); renderTeamPage(tb); wrap.appendChild(tb);
  } else {
    var nav = h('nav',{class:'card depts','aria-label':'الأقسام'}); renderDepts(nav);
    var sec = h('section',{class:'card'}); renderList(sec);
    var det = h('main',{class:'detail'});
    if(creating) renderCreate(det);
    else {
      if(deptFilter==='attendee' && seesAttendee()){
        det.appendChild(h('div',{class:'tabs',role:'group','aria-label':'عرض قسم تجربة الحضور'},
          h('button',{type:'button',class:'f'+(view==='sessions'?' on':''),on:function(){ view='sessions'; render(); },text:'لوحة الجلسات'}),
          h('button',{type:'button',class:'f'+(view==='task'?' on':''),on:function(){ view='task'; render(); },text:'مهام القسم'})));
      }
      if(deptFilter==='attendee' && seesAttendee() && view==='sessions') renderBoard(det);
      else {
        var t = tasks.filter(function(x){return x.id===sel;})[0];
        if(t) renderTask(det,t);
        else det.appendChild(h('section',{class:'card'},h('p',{class:'empty',text:'اختر مهمة من القائمة لتشوف تفاصيلها ومسارها.'})));
      }
    }
    wrap.appendChild(h('div',{class:'shell'},nav,sec,det));
  }
  root.replaceChildren(wrap);
}
async function startApp(){
  root.replaceChildren(h('div',{class:'wrap',dir:'rtl'},h('p',{class:'sub',text:'جارٍ التحميل…'})));
  await loadAll();
  page='work'; creating=false; deptFilter = isAdmin() ? 'all' : 'mine'; view='task';
  ensureSel(); render();
}

/* ---------- boot ---------- */
sb.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_OUT' && me){ renderLogin(); } });
document.addEventListener('visibilitychange',function(){ if(!document.hidden && me && !creating && page==='work'){ var a=document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; loadAll().then(render); } });
(async function(){
  try{
    var s = await sb.auth.getSession();
    if(s.data && s.data.session) await afterLogin(); else renderLogin();
  }catch(e){ renderLogin('تعذر الاتصال بالخادم. أعد تحميل الصفحة.'); }
})();
})();

</script>
</body>
</html>
